#boot-loader .boot-logo img{display:block;width:clamp(140px,19vw,235px);height:auto}
#boot-loader .boot-label{font:11px/1.5 Arial,sans-serif;letter-spacing:2px;color:#b5b7ad}

#boot-loader .boot-track:after{content:'';display:block;width:45%;height:100%;background:#f7eb62;animation:boot-slide 1.2s ease-in-out infinite}

/* Finish loading, then reveal the moving image underneath. */
#boot-loader{clip-path:inset(0 0 0 0);transition:clip-path .95s cubic-bezier(.76,0,.24,1);will-change:clip-path}
#boot-loader .boot-logo{transition:transform .8s cubic-bezier(.22,1,.36,1),opacity .65s ease,filter .8s ease;will-change:transform,opacity}
#boot-loader .boot-label,#boot-loader .boot-track{transition:opacity .3s ease,transform .5s ease}
#boot-loader .boot-track:after{transition:width .3s ease,transform .3s ease}
#boot-loader.is-complete .boot-track:after{animation:none;width:100%;transform:none}
#boot-loader.is-complete .boot-label{color:#f7eb62}
#boot-loader.is-exiting{clip-path:inset(0 0 100% 0)}
#boot-loader.is-exiting .boot-logo{transform:translateY(-65px) scale(1.55);opacity:0;filter:blur(10px)}
#boot-loader.is-exiting .boot-label,#boot-loader.is-exiting .boot-track{opacity:0;transform:translateY(-18px)}
body.is-revealing{overflow:hidden}
body.is-revealing>header,body.is-revealing>main,body.is-revealing>footer{animation:boot-content-in 1.15s cubic-bezier(.22,1,.36,1) both}
@keyframes boot-content-in{from{transform:translateY(28px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){#boot-loader,#boot-loader .boot-logo,#boot-loader .boot-label,#boot-loader .boot-track,#boot-loader .boot-track:after{transition:none!important}body.is-revealing>header,body.is-revealing>main,body.is-revealing>footer{animation:none}#boot-loader.is-exiting .boot-logo{transform:none;filter:none}}
